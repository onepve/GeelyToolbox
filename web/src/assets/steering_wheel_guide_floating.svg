<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 172" width="220" height="172">
  <!-- 黑白重绘方向盘右侧多媒体按键示意图：透明底、纯黑白、三排紧凑、序号内嵌按键正中央 -->
  <g fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5" stroke-linejoin="round">
    <!-- 上排：① 返回键 + ② 滚轮 + ③ 静音键 -->
    <rect x="34" y="16" width="50" height="44" rx="10"/>
    <ellipse cx="110" cy="38" rx="20" ry="28"/>
    <rect x="136" y="16" width="50" height="44" rx="10"/>
    <!-- 中排：⑦ 向左选择 + ④ 向右选择 -->
    <path d="M58 78 L30 94 L58 110 Z"/>
    <path d="M162 78 L190 94 L162 110 Z"/>
    <!-- 下排：⑥ MODE 键 + ⑤ 自定义键 -->
    <rect x="30" y="126" width="74" height="36" rx="9"/>
    <rect x="116" y="126" width="74" height="36" rx="9"/>
  </g>
  <!-- 序号内嵌按键正中央 -->
  <g fill="#0a0a0a" font-family="Arial, sans-serif" font-weight="800" font-size="18" text-anchor="middle" dominant-baseline="central">
    <text x="59" y="38">1</text>
    <text x="110" y="38">2</text>
    <text x="161" y="38">3</text>
    <text x="46" y="94">7</text>
    <text x="174" y="94">4</text>
    <text x="67" y="144">6</text>
    <text x="153" y="144">5</text>
  </g>
</svg>