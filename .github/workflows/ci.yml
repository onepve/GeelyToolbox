name: Build & Release GeelyConsole APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'beta-v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 发布说明按真实提交记录生成，需要完整历史与 Tag 才能界定改动区间
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Node.js & Build Vite Web Assets
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm & Build Frontend
        run: |
          npm install -g pnpm
          cd web
          pnpm install --no-frozen-lockfile --dangerously-allow-all-builds
          pnpm build
          cd ..

      - name: WebView Render Parity Gate (车机内核一致性 · 效果图=车机)
        run: python3 scripts/check_webview_render_parity.py

      - name: Inject Tag Version & VersionCode (Tag-Driven, Dual Channel)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_RAW="${GITHUB_REF#refs/tags/}"
          IS_BETA=false
          REV=99
          if [[ "$TAG_RAW" == beta-* ]]; then
            IS_BETA=true
            TAG_VER="${TAG_RAW#beta-v}"
            # 测试版必须使用四段号 beta-vX.Y.Z.N（N = 1~98 测试序号），严禁与正式版同码
            IFS='.' read -r MAJ MIN PATCH REVISION <<< "$TAG_VER"
            if [[ -z "$REVISION" ]]; then
              echo "!! [FAIL] 测试版 Tag 必须为四段号 beta-vX.Y.Z.N（如 beta-v1.7.8.1），当前: ${TAG_RAW}"; exit 1
            fi
            REV="$REVISION"
            if (( REV < 1 || REV > 98 )); then
              echo "!! [FAIL] 测试序号必须为 1~98（beta-vX.Y.Z.N），当前: ${REV}"; exit 1
            fi
            BASE_VER="${MAJ}.${MIN}.${PATCH}"
            VNAME="${BASE_VER}-beta.${REV}"
          else
            TAG_VER="${TAG_RAW#v}"
            IFS='.' read -r MAJ MIN PATCH <<< "$TAG_VER"
            BASE_VER="${TAG_VER}"
            VNAME="${TAG_VER}"
          fi
          # 新公式（消除 1.7.10 与 1.8.0 撞码）：(主*10000+次*100+修订)*100 + 序号
          # 正式版序号固定 99，测试版序号 1~98 → 同版本测试号恒排在正式号之前
          VCODE=$(( (MAJ*10000 + MIN*100 + PATCH) * 100 + REV ))
          echo "Injecting tag-driven version: ${VNAME} (versionCode ${VCODE}, base ${BASE_VER}, rev ${REV})"
          # 只替换真正的赋值行：全局 sed 会把注释里出现的 "versionCode /versionName" 也
          # 补上一个号（[0-9]* 允许零位），凭空造出第二行 versionCode，
          # 导致下面 grep -oP 取回两行、校验必然失败（beta-v1.8.33.1 实测踩到）。
          sed -i -E "s/^([[:space:]]*versionCode )[0-9]+/\1${VCODE}/" app/build.gradle
          sed -i -E "s/^([[:space:]]*versionName )\"[^\"]*\"/\1\"${VNAME}\"/" app/build.gradle
          grep -nE '^[[:space:]]*version(Name|Code)' app/build.gradle
          GOT_CODE=$(grep -oP '^[[:space:]]*versionCode \K[0-9]+' app/build.gradle | head -1)
          GOT_NAME=$(grep -oP '^[[:space:]]*versionName "\K[^"]+' app/build.gradle | head -1)
          if [[ "$GOT_CODE" != "$VCODE" || "$GOT_NAME" != "$VNAME" ]]; then
            echo "!! [FAIL] Tag version/versionCode injection verification failed. Aborting."
            exit 1
          fi
          echo "[PASS] build.gradle now: ${GOT_NAME} (code ${GOT_CODE}) — matches publish_r2.py formula"

      # 发版版本单调性门禁（防降级双通道）：在昂贵 gradle 构建前 fail-fast，
      # 拦截「候选 versionCode < 线上正式版」的降级 Tag（如正式 1.8.20 后误打 beta-v1.8.20.1）。
      # 正式版与测试版分开校验，规则见 scripts/check_release_version_gate.py。
      - name: Release Version Monotonicity Gate (Anti-Downgrade · Dual Channel)
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/check_release_version_gate.py --tag "${GITHUB_REF#refs/tags/}"

      - name: Run CI Health Checks (Links, JSBridge, DOM Handlers, Version Contract)
        run: python3 scripts/ci_health_check.py

      - name: Build Release APK (Verification)
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/GeelyConsole.apk

      - name: Verify APK Integrity (Toolchain Regression Guard)
        run: |
          set -e
          python3 - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile('output/GeelyConsole.apk')
          data = z.read('classes.dex')
          info = z.getinfo('classes.dex')
          fail = []

          # 1. dex 必须仍是 deflate 压缩（useLegacyPackaging 生效）
          if info.compress_type != 8:
              fail.append('classes.dex 未压缩，useLegacyPackaging 失效')
          print(f"  classes.dex: {info.file_size}B -> {info.compress_size}B "
                f"{'DEFLATE' if info.compress_type==8 else 'STORE'}")

          # 2. dex 体积上限，防止 kotlin-stdlib 等被悄悄注入
          #    纯 Java 项目实测 858KB；AGP 9 内置 Kotlin 会膨胀到 2.9MB
          if info.file_size > 1_100_000:
              fail.append(f'dex 异常膨胀 {info.file_size}B（>1.1MB），疑似工具链注入多余运行时')
          print(f"  dex 体积门禁: {info.file_size}B / 上限 1100000B")

          # 3. 不允许出现 kotlin.* 类
          import struct
          def u32(o): return struct.unpack_from('<I', data, o)[0]
          sid, tid, cdef, nc = u32(0x3C), u32(0x44), u32(0x64), u32(0x60)
          def s_get(i):
              off = struct.unpack_from('<I', data, sid + i*4)[0]
              n, p, sh = 0, off, 0
              while True:
                  b = data[p]; p += 1; n |= (b & 0x7f) << sh; sh += 7
                  if not (b & 0x80): break
              return data[p:p+n].decode('utf-8', 'replace')
          kt = 0
          for i in range(nc):
              t = struct.unpack_from('<I', data, cdef + i*32)[0]
              nm = s_get(struct.unpack_from('<I', data, tid + t*4)[0])
              if nm.startswith('Lkotlin/'): kt += 1
          print(f"  kotlin.* 类数量: {kt}（应为 0）")
          if kt > 0:
              fail.append(f'混入 {kt} 个 kotlin 类，检查 android.builtInKotlin=false 是否生效')

          # 4. 语音资产必须完整
          mp3 = [i for i in z.infolist() if i.filename.endswith('.mp3')]
          print(f"  语音 mp3: {len(mp3)} 个（应 25）")
          if len(mp3) != 25:
              fail.append(f'语音数量异常: {len(mp3)} != 25')

          # 5. 前端资源必须在
          if 'assets/toolbox_ui.html' not in z.namelist():
              fail.append('toolbox_ui.html 缺失')

          print()
          if fail:
              for f in fail: print('  [FAIL]', f)
              sys.exit(1)
          print('  [PASS] APK 体积与内容均正常')
          PY

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | tail -1)
          "$APKSIGNER" verify --print-certs output/GeelyConsole.apk 2>&1 | head -5

            # APK 直接通过 R2 和 GitHub Release 分发，免占用 Actions Artifact 存储配额

            # 🌟 分流推送：正式版 Tag (v*) 更新正式版，测试版 Tag (beta-v*) 仅更新测试通道
      - name: Push APK & Metadata to R2 on Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          # 安装 AWS CLI（R2 兼容 S3 API）
          if ! command -v aws &>/dev/null; then
            curl -sL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
            unzip -qo /tmp/awscliv2.zip -d /tmp/awscli
            /tmp/awscli/aws/install --update
          fi

          export VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          export VERSION_CODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          export TAG_NAME="${GITHUB_REF#refs/tags/}"

          # 配置 aws cli 访问 R2
          export AWS_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION=auto
          BUCKET="s3://downloads/GeelyToolbox/"

          # 如果是正式版发布，预先拉取线上 apps.json 供脚本更新
          if [[ "$TAG_NAME" != beta-* ]]; then
            curl -sSL -f "https://dl.onepve.com/GeelyToolbox/apps.json?t=$(date +%s)" -o /tmp/apps.json || rm -f /tmp/apps.json
          fi

          # 统一由独立 Python 脚本生成规范元数据，彻底避免 shell heredoc 缩进问题
          python3 scripts/publish_r2.py

          if [[ "$TAG_NAME" == beta-* ]]; then
            echo "⚡ 正在同步【测试通道】至 R2..."
            aws s3 cp output/GeelyConsole.apk "${BUCKET}GeelyToolbox-beta.apk" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" --no-progress
            aws s3 cp output/GeelyConsole.apk "${BUCKET}GeelyPilot-beta.apk" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" --no-progress
            aws s3 cp /tmp/version-beta.json "${BUCKET}version-beta.json" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" --no-progress
          else
            echo "🚀 正在同步【正式通道】至 R2..."
            aws s3 cp output/GeelyConsole.apk "${BUCKET}GeelyToolbox.apk" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" --no-progress
            aws s3 cp output/GeelyConsole.apk "${BUCKET}GeelyPilot.apk" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" --no-progress
            aws s3 cp /tmp/version.json "${BUCKET}version.json" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" --no-progress
            if [ -f /tmp/apps.json ]; then
              aws s3 cp /tmp/apps.json "${BUCKET}apps.json" \
                --endpoint-url "${{ secrets.R2_ENDPOINT }}" --no-progress
            fi
          fi

          if [ -f /tmp/oil-price.json ]; then
            echo "⚡ 正在同步全国油价元数据至 R2..."
            aws s3 cp /tmp/oil-price.json "${BUCKET}oil-price.json" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" --no-progress
          fi

      - name: Purge Cloudflare CDN Cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo ">> 正在强刷 Cloudflare CDN 边缘节点缓存，杜绝旧版本安装包与元数据脏读..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/11e721ee98e46e59da3e50fe90eef7ce/purge_cache" \
              -H "Authorization: Bearer ***" \
              -H "Content-Type: application/json" \
              --data '{"files":[
                "https://dl.onepve.com/GeelyToolbox/version.json",
                "https://dl.onepve.com/GeelyToolbox/version-beta.json",
                "https://dl.onepve.com/GeelyToolbox/apps.json",
                "https://dl.onepve.com/GeelyToolbox/GeelyToolbox.apk",
                "https://dl.onepve.com/GeelyToolbox/GeelyPilot.apk",
                "https://dl.onepve.com/GeelyToolbox/GeelyToolbox-beta.apk",
                "https://dl.onepve.com/GeelyToolbox/GeelyPilot-beta.apk"
              ]}' || true
            echo ">> Cloudflare CDN 刷新指令已下发！"
          fi

      - name: Publish Official Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: "缤越助手 ${{ github.ref_name }}"
          body_path: /tmp/release_changelog.txt
          files: |
            output/GeelyConsole.apk
          draft: false
          prerelease: ${{ startsWith(github.ref, 'refs/tags/beta-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 发正式版时自动销毁所有旧测试版 Release与Tag；发测试版时仅替换旧测试版，历史正式版永久保留
      - name: Cleanup Old Releases & Tags on Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set +e
          CURRENT_TAG="${{ github.ref_name }}"
          echo ">> 执行 Release & Tag 生命周期管控 (当前: $CURRENT_TAG)..."

          if [[ "$CURRENT_TAG" != beta-* ]]; then
            echo "1. 当前为【正式版发版】：历史正式版永久归档保留，全面销毁所有历史临时测试版..."
            gh release list -R "${{ github.repository }}" --exclude-drafts=false --limit 100 --json tagName -q ".[].tagName" | grep '^beta-' | while read -r tag; do
              if [ -n "$tag" ]; then
                echo "销毁临时测试版 Release: $tag"
                gh release delete "$tag" -R "${{ github.repository }}" -y 2>/dev/null || true
              fi
            done

            git ls-remote --tags origin | awk '{print $2}' | sed 's@refs/tags/@@' | grep -v '\^{}' | grep '^beta-' | while read -r tag; do
              if [ -n "$tag" ]; then
                echo "删除临时测试版 Git Tag: $tag"
                git push origin --delete "$tag" 2>/dev/null || true
              fi
            done
            echo ">> 正式版归档完成，历史测试版已全量销毁清空。"
          else
            echo "2. 当前为【测试版发版】：严禁触碰正式版，仅自动清理除当前测试版外的旧测试版..."
            gh release list -R "${{ github.repository }}" --exclude-drafts=false --limit 100 --json tagName -q ".[].tagName" | grep '^beta-' | while read -r tag; do
              if [ -n "$tag" ] && [ "$tag" != "$CURRENT_TAG" ]; then
                echo "清理旧测试版 Release: $tag"
                gh release delete "$tag" -R "${{ github.repository }}" -y 2>/dev/null || true
              fi
            done

            git ls-remote --tags origin | awk '{print $2}' | sed 's@refs/tags/@@' | grep -v '\^{}' | grep '^beta-' | while read -r tag; do
              if [ -n "$tag" ] && [ "$tag" != "$CURRENT_TAG" ]; then
                echo "清理旧测试版 Git Tag: $tag"
                git push origin --delete "$tag" 2>/dev/null || true
              fi
            done
            echo ">> 测试通道更新完成，历史正式版完好无损。"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 每次运行无论成功失败，自动清理旧缓存、历史旧构建产物与所有历史 CI 运行记录，防止存储超量
      - name: Auto Cleanup Old CI Runs, Caches & Artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # 铁律：同一次推送可能并发触发 main 与 tag 两条流水线。只要有别的运行还在排队/进行中，
          # 本次清理整体跳过 —— 否则会删掉兄弟运行正在用的构建缓存与历史产物，
          # 甚至（旧版逻辑）直接把对方的 run 记录删掉，造成「tag 打了但没有发版」。
          BUSY=$(gh run list -R "${{ github.repository }}" -L 100 --json databaseId,status \
            -q "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\")] | length")
          if [ "${BUSY:-0}" != "0" ]; then
            echo "Another run is still active (${BUSY}) — skipping cleanup this round."
            exit 0
          fi

          echo "1. Cleaning up repository action caches..."
          gh extension install actions/gh-actions-cache 2>/dev/null || true
          gh actions-cache list -R "${{ github.repository }}" -L 100 --order desc | cut -f 1 | while read -r key; do
            [ -n "$key" ] && gh actions-cache delete "$key" -R "${{ github.repository }}" --confirm 2>/dev/null || true
          done

          echo "2. Cleaning up repository action artifacts..."
          gh api repos/"${{ github.repository }}"/actions/artifacts -q '.artifacts[].id' 2>/dev/null | while read -r artifact_id; do
            if [ -n "$artifact_id" ]; then
              echo "Deleting artifact: $artifact_id"
              gh api -X DELETE repos/"${{ github.repository }}"/actions/artifacts/"$artifact_id" 2>/dev/null || true
            fi
          done

          echo "3. Cleaning up old workflow runs (keeping current)..."
          # 铁律：只清「已经结束且至少 1 小时前」的运行。
          # 以前这里无条件删掉除自己以外的所有 run，结果同一次推送里 main 与 tag
          # 两条流水线并发启动时，先结束的那条把还在跑的 tag 发布彻底删掉 —— 
          # beta-v1.8.33.1 实测：tag run 被兄弟 run 清理掉，仓库里只剩一条 main run。
          gh run list -R "${{ github.repository }}" -L 100 --json databaseId,status,createdAt \
            -q '.[] | select(.databaseId != ${{ github.run_id }}) | select(.status == "completed") | select((.createdAt | fromdateiso8601) < (now - 3600)) | .databaseId' \
            | while read -r run_id; do
            if [ -n "$run_id" ]; then
              echo "Deleting old run: $run_id"
              gh run delete "$run_id" -R "${{ github.repository }}" 2>/dev/null || true
            fi
          done
