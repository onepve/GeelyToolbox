plugins {
    id 'com.android.application'
}

android {
    namespace = 'app.onepve.geelyconsole'
    compileSdk 34

    defaultConfig {
        applicationId "app.onepve.geelyconsole"
        minSdk 28
        targetSdk 28
        // versionCode / versionName 必须保留旧式写法：CI 版本注入脚本与门禁正则依赖此格式
        versionCode 1083299
        versionName "1.8.32"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: "android"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = false
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig = signingConfigs.release
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'mp3', 'wav', 'ogg', 'xtz'
    }

    packaging {
        dex {
            // 让 classes.dex 走 deflate 压缩，省约 500KB；安装时解压到 dalvik-cache，不影响启动速度
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'javazoom:jlayer:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}
