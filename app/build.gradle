plugins {
    id 'com.android.application'
}

android {
    namespace = 'app.onepve.geelyconsole'
    compileSdk 34

    defaultConfig {
        applicationId "app.onepve.geelyconsole"
        minSdk 28
        targetSdk 28
        // versionCode / versionName 必须保留旧式写法：CI 版本注入脚本与门禁正则依赖此格式
        versionCode 1083299
        versionName "1.8.32"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: "android"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = false
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig = signingConfigs.release
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'mp3', 'wav', 'ogg', 'xtz'
    }

    packaging {
        dex {
            // classes.dex 必须走 STORED（不压缩）：ART 可直接 mmap 映射，冷启动零解压零写盘。
            // 历史坑：曾设为 true 省下约 0.5MB，换来每次冷启动都要把 860KB dex 解压到 dalvik-cache，
            // 车机 Android 9 弱 CPU 上明显拖慢首屏。0.5MB 的包体收益毫无意义，启动速度优先。
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'javazoom:jlayer:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}
