・跨设备通道互斥：车机自带音乐（如车机 QQ音乐/网易云）与手机微信分别运行在车机和手机两个独立设备上。
・手机微信放语音时，蓝牙推流会向车机申请独占声道，车机自带音乐会被系统自动暂停；但微信播完后，手机蓝牙不会通知车机已结束，车机无法得知何时恢复。

2. ⚠️ 特别注意：为什么语音播完后突然唱起了「手机里的歌」？
・手机系统优先机制：如果您的手机后台驻留了音乐软件（哪怕处于暂停状态），手机微信放完语音后，手机系统会自动判定优先唤醒手机自带的音乐继续播放，并持续通过蓝牙推流给车机，而绝不会自动切回车机之前放的歌。
・若您当前只想听车机自带音乐，建议将手机后台的音乐 App 彻底划掉关闭。

3. 听完手机语音后，如何继续听车机自带音乐？
