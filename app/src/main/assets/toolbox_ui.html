2. 单次行程防抖：单次行驶过程中仅触发一次，中途红绿灯停车或减速再次起步绝不重复触发。

3. 自动待命重置：车辆停稳重新挂入 P 挡后，自动重置状态，等待下一次起步。

4. 播放时效说明：车机刚开机且音乐软件从未打开过（冷态），第三方软件（如 QQ 音乐）需在后台加载组件、等待车机 4G 联网并向腾讯云鉴权拉取歌曲，耗时约需 15~30 秒，此属第三方播放器冷启动客观现象；若软件此前已打开过（热态），车速达标瞬间即可秒级恢复播放。`,tip:"支持后台静默播放（不抢导航视线）或前台全屏大屏沉浸播放。冷态起步需等待第三方软件 4G 鉴权出声，热态秒播。"},speed_custom:{title:"【功能指南】车速达标自定义动作",desc:`1. 车速阈值唤起：行驶车速达到设定阈值时，自动唤醒高德车机地图或自选软件，无需行车中分心操作屏幕。

2. 行程防抖机制：单次行驶中仅触发一次，避免频繁弹窗；挂入 P 挡停稳后自动重置待命。`,tip:"适合将阈值设为 40~50 km/h，出地库上主路巡航时自动切回大屏导航。"},turn_signal_360:{title:"【功能指南】转向灯开启联动 360",desc:`1. 盲区辅助：打左或右转向灯时，自动唤醒 360 全景环视影像，消除后视镜与侧向盲区。

2. 自动退出：转向灯拨杆回正关闭后，360 全景自动退出并还原原屏幕界面。
