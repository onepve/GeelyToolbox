iv class="w-full p-3 rounded-xl bg-car-card border border-car-border whitespace-nowrap" data-v-711a2268><span class="text-car-accent font-black mr-1.5" data-v-711a2268>⑦ 向左选择键:</span> 上一个文件 / 上一曲 (单击自定义) </div></div>',1))])):oe("",!0)]),F(rt,{title:"方控按键接管模式",desc:"彻底屏蔽原厂收音机伴听抢占广播，支持米小江优先协同或控制台全量独立接管。若两个软件都装，选米小江优先互不冲突。",helpTitle:"【功能指南】方控接管模式、EAS 蓝牙硬件通道与仪表投递",helpText:`1. 接管模式选择：
• 控制台独立接管（推荐）：方向盘按键直接控制切歌与播放，自动唤醒车载喇叭，体验最流畅。
• 米小江方控优先：如果车机上装了米小江 CarMedia，选这项让它优先处理切歌，两者互不打扰。
• 恢复原厂默认：不拦截方向盘按键，全部交回原车控制。

2. 蓝牙无声问题解决：

・跨设备通道互斥：车机自带音乐（如车机 QQ音乐/网易云）与手机微信分别运行在车机和手机两个独立设备上。
・手机微信放语音时，蓝牙推流会向车机申请独占声道，车机自带音乐会被系统自动暂停；但微信播完后，手机蓝牙不会通知车机已结束，车机无法得知何时恢复。

2. ⚠️ 特别注意：为什么语音播完后突然唱起了「手机里的歌」？
・手机系统优先机制：如果您的手机后台驻留了音乐软件（哪怕处于暂停状态），手机微信放完语音后，手机系统会自动判定优先唤醒手机自带的音乐继续播放，并持续通过蓝牙推流给车机，而绝不会自动切回车机之前放的歌。
・若您当前只想听车机自带音乐，建议将手机后台的音乐 App 彻底划掉关闭。

3. 听完手机语音后，如何继续听车机自带音乐？
