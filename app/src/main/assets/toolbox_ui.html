仅触发一次，手动退出后绝不反复弹出。

2. 单次行程防抖：单次行驶过程中仅触发一次，中途等红绿灯停下或减速再次起步绝不重复触发。

3. 自动重置状态：车辆停稳重新挂入 P 挡后，自动重置状态，等待下一次起步。

4. 播放说明：车机刚打火开机且音乐软件从未打开过时，部分三方音乐软件需要联网加载账号信息，需要几秒时间；若平时软件已经在后台，达到设定时速即可瞬间恢复播放。`,tip:"支持后台静默播放（不抢导航视线）或前台全屏大屏沉浸播放。刚开机时稍等片刻联网，平时在后台秒播。"},speed_custom:{title:"【功能指南】车速达标自定义动作",desc:"车速达到设定数值后，自动打开高德车机地图或自选的任意第三方应用。单次行程仅触发一次。",tip:"常用导航建议设为「高德车机地图」。"},light_nav:{title:"【功能指南】进隧道大灯联动高德",desc:`1. 自动深色护眼：

2. 出隧道自动恢复：
出隧道或离开地库关闭大灯后，自动恢复白天清爽浅色地图。

3. 版本适配说明：
本功能针对高德地图 7.5 经典版深度适配生效。`,tip:"使用高德 7.5 经典版的车友推荐开启。"},turn_signal_360:{title:"【功能指南】转向灯开启联动 360",desc:`1. 盲区辅助：打左或右转向灯时，自动唤醒 360 全景环视影像，消除后视镜与侧向盲区。

2. 自动退出：转向灯拨杆回正关闭后，360 全景自动退出并还原原屏幕界面。
