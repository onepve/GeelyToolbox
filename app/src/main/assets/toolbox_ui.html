2. 单次行程防抖：单次行驶过程中仅触发一次，中途红绿灯停车或减速再次起步绝不重复触发。

3. 自动待命重置：车辆停稳重新挂入 P 挡后，自动重置状态，等待下一次起步。

4. 播放时效说明：车机刚开机且音乐软件从未打开过（冷态），第三方软件（如 QQ 音乐）需在后台加载组件、等待车机 4G 联网并向腾讯云鉴权拉取歌曲，耗时约需 15~30 秒，此属第三方播放器冷启动客观现象；若软件此前已打开过（热态），车速达标瞬间即可秒级恢复播放。`,tip:"支持后台静默播放（不抢导航视线）或前台全屏大屏沉浸播放。冷态起步需等待第三方软件 4G 鉴权出声，热态秒播。"},speed_custom:{title:"【功能指南】车速达标自定义动作",desc:"车速达到设定阈值后，自动打开高德车机地图或自选的任意第三方应用。单次行程仅触发一次。",tip:"常用导航建议设为「高德车机地图」。"},light_nav:{title:"【功能指南】进隧道大灯联动高德",desc:`1. 自动深色护眼：

2. 出隧道自动恢复：
出隧道或离开地库关闭大灯后，自动恢复白天清爽浅色地图。

3. 版本适配说明：
